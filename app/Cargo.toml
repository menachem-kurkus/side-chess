[package]
name = "side-chess"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "A tiny chess window for playing a Claude Code session"

[[bin]]
name = "side-chess"
path = "src/main.rs"

[dependencies]
winit = "0.30"
softbuffer = "0.4"
png = "0.17"
shakmaty = "0.27"

[build-dependencies]
fontdue = "0.9"
png = "0.17"

[profile.release]
opt-level = 3
lto = true
strip = true
