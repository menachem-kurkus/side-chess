[package]
name = "side-chess"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "A tiny chess window for playing a Claude Code session, on Mac and Windows"

[[bin]]
name = "side-chess"
path = "src/main.rs"

[dependencies]
winit = "0.30"
png = "0.17"
shakmaty = "0.27"

[target.'cfg(target_os = "macos")'.dependencies]
# Showing frames on macOS (the same bindings winit's helpers use)
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes", "CFData", "CFString"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "objc2", "CGColorSpace", "CGDataProvider", "CGImage", "CGContext", "CGBitmapContext"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "CALayer", "CATransaction"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
# Windows: the frame goes straight into the window's own buffer
softbuffer = "0.4"

[build-dependencies]
fontdue = "0.9"
png = "0.17"

[profile.release]
opt-level = 3
lto = true
strip = true
